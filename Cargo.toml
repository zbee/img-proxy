[package]
name = "img-proxy"
version = "0.2.0"
edition = "2021"
authors = ["Ethan Henderson <ethan@zbee.codes>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
