<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>img-proxy dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
      @keyframes slideDown {
          0% { opacity: 0; transform: translateY(-10px); }
          100% { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-down { animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .tile img, .tile video { transition: transform 0.2s ease; }
      .tile:hover img, .tile:hover video { transform: scale(1.01); }

      @media (prefers-reduced-motion: no-preference) {
          ::view-transition-old(root),
          ::view-transition-new(root) {
              animation-duration: 0.22s;
              animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
          }
          ::view-transition-old(root) { animation-name: vt-fade-out; }
          ::view-transition-new(root) { animation-name: vt-fade-in; }
          @keyframes vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
          @keyframes vt-fade-out { from { opacity: 1; } to { opacity: 0; } }
      }
  </style>
</head>
<body class="min-h-screen bg-black text-zinc-300 font-mono p-4" data-key="__KEY__">
<div class="max-w-5xl mx-auto">
  <header class="text-center mt-8 mb-10">
    <h1 class="text-2xl font-semibold text-zinc-100 tracking-tight">img-proxy</h1>
    <p class="text-sm text-zinc-500 mt-1">stash a URL, get a cached image, forget it exists</p>
  </header>

  <form id="add-form" method="POST" action="/?key=__KEY__"
        class="max-w-2xl mx-auto border border-zinc-800 rounded-lg bg-zinc-950 p-6 shadow-2xl shadow-zinc-950/40">
    <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1">Image URL</label>
    <input type="url" name="source" required
           placeholder="https://img.shields.io/badge/lang-rust-informational?style=for-the-badge&amp;logo=rust"
           class="w-full text-center rounded-md bg-zinc-900 border border-zinc-800 px-3 py-3
               text-zinc-100 placeholder-zinc-600
               focus:outline-none focus:ring-1 focus:ring-zinc-700 focus:border-zinc-700">
    <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
        <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1">Name</label>
        <input type="text" name="name" required pattern="[a-zA-Z0-9_-]+" placeholder="lang_cs"
               class="w-full rounded-md bg-zinc-900 border border-zinc-800 px-3 py-2
                   text-zinc-100 placeholder-zinc-600
                   focus:outline-none focus:ring-1 focus:ring-zinc-700">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1">Refresh</label>
        <select name="frequency"
                class="w-full rounded-md bg-zinc-900 border border-zinc-800 px-3 py-2
                   text-zinc-100 focus:outline-none focus:ring-1 focus:ring-zinc-700">
          <option value="1">Hourly</option>
          <option value="4" selected>4 hours</option>
          <option value="24">Daily</option>
          <option value="168">Weekly</option>
          <option value="720">Monthly</option>
          <option value="0">Never (upload once)</option>
        </select>
      </div>
    </div>
    <button type="submit"
            class="w-full mt-5 rounded-md bg-zinc-900 hover:bg-zinc-800 text-zinc-100 py-2
               transition-colors border border-zinc-700/50">
      Add / Update
    </button>
    <p class="text-[11px] text-zinc-600 mt-3 text-center">
      KV limit 25 MiB per image &middot; "Never" converts in your browser:
      GIF/PNG &rarr; WebP, video &rarr; WebM, SVG passes through
    </p>
  </form>

  __CONTENT__
</div>

<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/70" onclick="closeConfirm()"></div>
  <div class="relative bg-zinc-950 border border-zinc-800 rounded-lg p-6 max-w-md w-full shadow-2xl">
    <h2 class="text-sm font-semibold text-zinc-100 mb-4">
      Delete <span id="confirm-name" class="text-red-400"></span>?
    </h2>
    <div class="flex items-center justify-center p-4 bg-zinc-900 rounded-md border border-zinc-800 mb-5">
      <img id="confirm-img" src="" alt="" class="max-h-40 max-w-full h-auto">
    </div>
    <form id="confirm-form" method="POST">
      <div class="flex gap-3">
        <button type="button" onclick="closeConfirm()"
                class="flex-1 rounded-md bg-zinc-900 hover:bg-zinc-800 text-zinc-100 py-2
                   transition-colors border border-zinc-700/50">Cancel</button>
        <button type="submit"
                class="flex-1 rounded-md bg-red-950 hover:bg-red-900 text-red-200 py-2
                   transition-colors border border-red-900/50">Delete it</button>
      </div>
    </form>
  </div>
</div>

<script src="/dashboard.js"></script>
</body>
</html>
