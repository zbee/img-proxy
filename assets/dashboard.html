<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>img-proxy dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mocha: {
              crust: '#11111b',
              mantle: '#181825',
              base: '#1e1e2e',
              surface0: '#313244',
              surface1: '#45475a',
              surface2: '#585b70',
              overlay0: '#6c7086',
              subtext0: '#a6adc8',
              text: '#cdd6f4',
              mauve: '#cba6f7',
              'mauve-hover': '#b48eed',
              lavender: '#b4befe',
              red: '#f38ba8',
              green: '#a6e3a1',
            }
          },
          boxShadow: {
            'glow': '0 10px 30px -10px rgba(203, 166, 247, 0.12), 0 20px 40px -15px rgba(0, 0, 0, 0.7)',
            'tile': '0 4px 20px rgba(0, 0, 0, 0.35)',
          }
        }
      }
    }
  </script>
  <style>
      @keyframes slideDown {
          0% { opacity: 0; transform: translateY(-10px); }
          100% { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: no-preference) {
          ::view-transition-old(root),
          ::view-transition-new(root) {
              animation-duration: 0.22s;
              animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
          }
          ::view-transition-old(root) { animation-name: vt-fade-out; }
          ::view-transition-new(root) { animation-name: vt-fade-in; }
          @keyframes vt-fade-in { from { opacity: 0; } to { opacity: 1; } }
          @keyframes vt-fade-out { from { opacity: 1; } to { opacity: 0; } }
      }
  </style>
</head>
<body class="min-h-screen bg-mocha-crust text-mocha-text font-mono p-4 selection:bg-mocha-mauve/30 selection:text-mocha-mauve" data-key="__KEY__">
<div class="max-w-5xl mx-auto">
  <header class="text-center mt-8 mb-10">
    <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-mocha-mauve via-mocha-lavender to-mocha-text tracking-tight">img-proxy</h1>
    <p class="text-sm text-mocha-subtext0 mt-1">stash a URL, get a cached image, forget it exists</p>
  </header>

  <form id="add-form" method="POST" action="/?key=__KEY__"
        class="max-w-2xl mx-auto border border-mocha-surface0/80 rounded-xl bg-mocha-mantle p-6 shadow-glow ring-1 ring-white/5">
    <label class="block text-xs uppercase font-medium tracking-wider text-mocha-subtext0 mb-1.5">Image URL</label>
    <input type="url" name="source" required
           placeholder="https://img.shields.io/badge/lang-rust-informational?style=for-the-badge&amp;logo=rust"
           class="w-full text-center rounded-lg bg-mocha-crust border border-mocha-surface0 px-3 py-3
               text-mocha-text placeholder-mocha-overlay0
               focus:outline-none focus:ring-2 focus:ring-mocha-mauve/40 focus:border-mocha-mauve transition">
    <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
        <label class="block text-xs uppercase tracking-wide text-mocha-subtext0 mb-1">Name</label>
        <input type="text" name="name" required pattern="[a-zA-Z0-9_\-]+" placeholder="lang_cs"
               class="w-full rounded-lg bg-mocha-crust border border-mocha-surface0 px-3 py-2
                   text-mocha-text placeholder-mocha-overlay0
                   focus:outline-none focus:ring-2 focus:ring-mocha-mauve/40 focus:border-mocha-mauve transition">
      </div>
      <div>
        <label class="block text-xs uppercase font-medium tracking-wider text-mocha-subtext0 mb-1.5">Refresh</label>
        <select name="frequency"
                class="w-full rounded-lg bg-mocha-crust border border-mocha-surface0 px-3 py-2
                   text-mocha-text focus:outline-none focus:ring-2 focus:ring-mocha-mauve/40 focus:border-mocha-mauve transition cursor-pointer">
          <option value="1">Hourly</option>
          <option value="4" selected>4 hours</option>
          <option value="24">Daily</option>
          <option value="168">Weekly</option>
          <option value="720">Monthly</option>
          <option value="0">Never (upload once)</option>
        </select>
      </div>
    </div>
    <button type="submit"
            class="w-full mt-5 rounded-lg bg-mocha-mauve hover:bg-mocha-mauve-hover text-mocha-crust font-semibold py-2.5
               transition-all shadow-md shadow-mocha-mauve/10 active:scale-[0.99] cursor-pointer">
      Add / Update
    </button>
    <p class="text-[11px] text-mocha-overlay0 mt-3 text-center">
      KV limit 25 MiB per image &middot;
      "Never" converts and compresses in your browser &rarr; WebP, WebM
    </p>
  </form>

  __CONTENT__
</div>

<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-mocha-crust/80 backdrop-blur-sm" onclick="closeConfirm()"></div>
  <div class="relative bg-mocha-mantle border border-mocha-surface0 rounded-xl p-6 max-w-md w-full shadow-2xl ring-1 ring-white/5">
    <h2 class="text-sm font-semibold text-mocha-text mb-4">
      Delete <span id="confirm-name" class="text-mocha-red font-mono"></span>?
    </h2>
    <div class="flex items-center justify-center p-4 bg-mocha-crust rounded-lg border border-mocha-surface0 mb-5">
      <img id="confirm-img" src="" alt="" class="max-h-40 max-w-full h-auto rounded">
    </div>
    <form id="confirm-form" method="POST">
      <div class="flex gap-3">
        <button type="button" onclick="closeConfirm()"
                class="flex-1 rounded-lg bg-mocha-surface0 hover:bg-mocha-surface1 text-mocha-text font-medium py-2
                   transition-colors border border-mocha-surface1/50 cursor-pointer">Cancel</button>
        <button type="submit"
                class="flex-1 rounded-lg bg-mocha-red/20 hover:bg-mocha-red/30 text-mocha-red font-semibold py-2
                   transition-colors border border-mocha-red/40 cursor-pointer">Delete it</button>
      </div>
    </form>
  </div>
</div>

<script src="/dashboard.js"></script>
</body>
</html>
